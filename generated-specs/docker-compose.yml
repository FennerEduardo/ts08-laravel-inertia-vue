version: '3.8'

services:
  # Host Environment SDK Isolation Sandbox
  app:
    image: composer:2
    container_name: laravel-inertia-vue-auth-app
    volumes:
      - .:/app
    working_dir: /app
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DATABASE_URL=${DATABASE_URL:-postgresql://dev_user:dev_password@postgresql:5432/laravel-inertia-vue-auth_db}
    ports:
      - "8000:8000"
    depends_on:
      - postgresql

  # Database Service (postgresql)
  postgresql:
    image: postgres:16-alpine
    container_name: laravel-inertia-vue-auth-db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-laravel-inertia-vue-auth_db}
      POSTGRES_USER: ${POSTGRES_USER:-dev_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_password}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: laravel-inertia-vue-auth-redis
    ports:
      - "6379:6379"

volumes:
  db_data:
